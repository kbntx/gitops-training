apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello
  namespace: argocd
spec:
  destination:
    namespace: gitops-training
    server: https://kubernetes.default.svc
  project: default
  source:
    path: apps/hello/chart
    repoURL: https://github.com/kbntx/gitops-training.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
